<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Vidéo Sécurisé</title>
    <style>
        body {
            margin: 0;
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            padding: 20px 0; /* Ajoute un espace de sécurité en haut et en bas sur mobile */
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #e50914;
        }
        .grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 90%;
        }
        .video-card {
            background: #222;
            border: 4px solid transparent;
            border-radius: 20px;
            width: 250px;
            /* Changement : hauteur automatique pour s'adapter proprement au contenu */
            height: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 15px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .video-card:hover, .video-card.focused {
            border-color: #ffffff;
            transform: scale(1.05);
            background: #333;
        }
        
        /* AJOUT : Styles pour redimensionner proprement les miniatures */
        .video-thumb {
            width: 100%;
            aspect-ratio: 16 / 9; /* Force le format standard d'une miniature */
            object-fit: cover;    /* Rempli l'espace sans écraser ni étirer l'image */
            object-position: center;
            border-radius: 12px;  /* Optionnel : adoucit les angles de la miniature */
        }

        .video-card p {
            margin: 15px 0 5px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            width: 100%;
            /* Optionnel : empêche le texte de casser la mise en page s'il est trop long */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            z-index: 9999;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Nouvelles Vidéos!</h1>
    
    <div class="grid">
        <!-- VIDÉO 1 -->
        <div class="video-card focused" id="video-0" onclick="playVideo('IbOmFVJVVSY')">
            <!-- Lien d'image hébergé publiquement (Ne sera pas bloqué par le navigateur) -->
            <img class="video-thumb" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR270VT0tQr3T_XGITYKoUkEUGYvuLU9F6oZG8sQZEnHA&s=10" alt="Miniature 1">
            <p>Comptines pour apprendre - Titounis</p>
        </div>

        <!-- VIDÉO 2 -->
        <div class="video-card" id="video-1" onclick="playVideo('J_O424Z8vQs')">
            <img class="video-thumb" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQVtGCikYrpSK37LBqfuJASh5e-Od6IASm4umsCsuPzUw&s=10" alt="Miniature 2">
            <p>Apprendre Les couleurs - Les Titounis</p>
        </div>

        <!-- VIDÉO 3 -->
        <div class="video-card" id="video-2" onclick="playVideo('KOYONV1GjrI')">
            <img class="video-thumb" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlCo8l3tnRqeXM6dtvvYy7MEUA35-z37bzJWIpBdwGgw&s=10" alt="Miniature 3">
            <p>Apprendre les fruits en français</p>
        </div>

        <!-- VIDÉO 4 -->
        <div class="video-card" id="video-2" onclick="playVideo('6rSYst-n05M')">
            <img class="video-thumb" src="https://i.ytimg.com/vi/6rSYst-n05M/maxresdefault.jpg" alt="Miniature 3">
            <p>Apprendre les animaux et leurs cris</p>
        </div>

        <!-- VIDÉO 5 -->
        <div class="video-card" id="video-2" onclick="playVideo('zqPs8uKpsRQ')">
            <img class="video-thumb" src="https://i.ytimg.com/vi/zqPs8uKpsRQ/maxresdefault.jpg" alt="Miniature 3">
            <p>Apprendre a compter</p>
        </div>

        <!-- VIDÉO 6 -->
        <div class="video-card" id="video-2" onclick="playVideo('nP8Amij9VaQ')">
            <img class="video-thumb" src="https://i.ytimg.com/vi/nP8Amij9VaQ/sddefault.jpg" alt="Miniature 3">
            <p>Apprendre les formes</p>
        </div>

        <!-- VIDÉO 7 -->
        <div class="video-card" id="video-2" onclick="playVideo('2LG1nqWeKJ4')">
            <img class="video-thumb" src="https://i.ytimg.com/vi/2LG1nqWeKJ4/maxresdefault.jpg" alt="Miniature 3">
            <p>Atfal wa Mawahib</p>
        </div>

        <!-- VIDÉO 8 -->
        <div class="video-card" id="video-2" onclick="playVideo('https://www.tiktok.com/@muftimenkofficial/video/7697706279942245640')">
            <img class="video-thumb" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfP4riAAXzQT0ejGOhP_AIJmmA50iQxzG0eoV02_kaCYiQhG3XWVoIHx6h&s=10" alt="Miniature 3">
            <p>The world is building flying cars</p>
        </div>

        <!-- VIDÉO 3 -->
        <div class="video-card" id="video-2" onclick="playVideo('gfbfghgfhgfhf')">
            <img class="video-thumb" src="https://ibb.co" alt="Miniature 3">
            <p>Vidéo Animée</p>
        </div>

    
    </div>

    <div id="player-overlay">
        <!-- CORRECTION : Remplacement de la politique de sécurité pour autoriser la validation YouTube -->
        <iframe width="560" height="315" src="https://tux.im" frameborder="0" allowfullscreen></iframe>
    </div>

    <script>
        let currentIndex = 0;
        const totalVideos = 3;
        let isPlaying = false;

        function playVideo(videoId) {
            isPlaying = true;
            // Appel standardisé et sécurisé
            document.getElementById('video-frame').src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&controls=1&rel=0";
            document.getElementById('player-overlay').style.display = 'block';
        }

        function closeVideo() {
            isPlaying = false;
            document.getElementById('player-overlay').style.display = 'none';
            document.getElementById('video-frame').src = ""; 
        }

        document.addEventListener('keydown', function(e) {
            if (isPlaying) {
                if (e.keyCode === 10009 || e.key === "Backspace" || e.keyCode === 27) { 
                    closeVideo();
                    e.preventDefault();
                }
                return;
            }

            document.getElementById("video-" + currentIndex).classList.remove('focused');

            if (e.keyCode === 37) {
                if (currentIndex > 0) currentIndex--;
            } else if (e.keyCode === 39) {
                if (currentIndex < totalVideos - 1) currentIndex++;
            } else if (e.keyCode === 13) {
                document.getElementById("video-" + currentIndex).click();
            }

            document.getElementById("video-" + currentIndex).classList.add('focused');
        });
    </script>
</body>
</html>
