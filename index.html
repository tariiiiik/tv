<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Vidéo Sécurisé</title>
    <style>
        body {
            margin: 0;
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #e50914;
        }
        .grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 90%;
        }
        /* Transformation des blocs en vrais liens cliquables HTML */
        .video-card {
            background: #222;
            border: 4px solid transparent;
            border-radius: 15px;
            width: 280px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 15px;
            text-decoration: none; /* Enleve le soulignement du lien */
            display: block;
        }
        .video-card:hover, .video-card.focused {
            border-color: #ffffff;
            transform: scale(1.05);
            background: #333;
        }
        .video-thumb {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
        }
        .video-card p {
            margin: 15px 0 0 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>Vidéos Autorisées</h1>
    
    <div class="grid">
        <!-- VIDÉO 1 : Utilisation d'un lien hypertexte standard vers YouTube -->
        <a class="video-card focused" id="video-0" href="https://youtube.com">
            <img class="video-thumb" src="https://youtube.com">
            <p>Rick Astley</p>
        </a>

        <!-- VIDÉO 2 -->
        <a class="video-card" id="video-1" href="https://youtube.com">
            <img class="video-thumb" src="https://youtube.com">
            <p>Gangnam Style</p>
        </a>

        <!-- VIDÉO 3 -->
        <a class="video-card" id="video-2" href="https://youtube.com">
            <img class="video-thumb" src="https://youtube.com">
            <p>Despacito</p>
        </a>
    </div>

    <script>
        let currentIndex = 0;
        const totalVideos = 3;

        // Gestion simplifiée pour la télécommande de la TV
        document.addEventListener('keydown', function(e) {
            document.getElementById("video-" + currentIndex).classList.remove('focused');

            if (e.keyCode === 37) { // Gauche
                if (currentIndex > 0) currentIndex--;
            } else if (e.keyCode === 39) { // Droite
                if (currentIndex < totalVideos - 1) currentIndex++;
            } else if (e.keyCode === 13) { // Touche OK de la télécommande ou Entrée du PC
                // Force l'ouverture du lien HTML
                window.location.href = document.getElementById("video-" + currentIndex).href;
            }

            document.getElementById("video-" + currentIndex).classList.add('focused');
        });
    </script>
</body>
</html>
