<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Vidéo Sécurisé</title>
    <style>
        body {
            margin: 0;
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #e50914;
        }
        .grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 90%;
        }
        .video-card {
            background: #222;
            border: 4px solid transparent;
            border-radius: 20px;
            width: 250px;
            /* Changement : hauteur automatique pour s'adapter proprement au contenu */
            height: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 15px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .video-card:hover, .video-card.focused {
            border-color: #ffffff;
            transform: scale(1.05);
            background: #333;
        }
        
        /* AJOUT : Styles pour redimensionner proprement les miniatures */
        .video-thumb {
            width: 100%;
            aspect-ratio: 16 / 9; /* Force le format standard d'une miniature */
            object-fit: cover;    /* Rempli l'espace sans écraser ni étirer l'image */
            object-position: center;
            border-radius: 12px;  /* Optionnel : adoucit les angles de la miniature */
        }

        .video-card p {
            margin: 15px 0 5px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            width: 100%;
            /* Optionnel : empêche le texte de casser la mise en page s'il est trop long */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            z-index: 9999;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Vidéos Autorisées</h1>
    
    <div class="grid">
        <!-- VIDÉO 1 -->
        <div class="video-card focused" id="video-0" onclick="playVideo('IbOmFVJVVSY')">
            <!-- Lien d'image hébergé publiquement (Ne sera pas bloqué par le navigateur) -->
            <img class="video-thumb" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR270VT0tQr3T_XGITYKoUkEUGYvuLU9F6oZG8sQZEnHA&s=10" alt="Miniature 1">
            <p>Comptines pour apprendre - Titounis</p>
        </div>

        <!-- VIDÉO 2 -->
        <div class="video-card" id="video-1" onclick="playVideo('9bZkp7q19f0')">
            <img class="video-thumb" src="https://ibb.co" alt="Miniature 2">
            <p>Musique 2</p>
        </div>

        <!-- VIDÉO 3 -->
        <div class="video-card" id="video-2" onclick="playVideo('kJQP7kiw5Fk')">
            <img class="video-thumb" src="https://ibb.co" alt="Miniature 3">
            <p>Vidéo Animée</p>
        </div>
    </div>

    <div id="player-overlay">
        <!-- CORRECTION : Remplacement de la politique de sécurité pour autoriser la validation YouTube -->
        <iframe id="video-frame" allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

    <script>
        let currentIndex = 0;
        const totalVideos = 3;
        let isPlaying = false;

        function playVideo(videoId) {
            isPlaying = true;
            // Appel standardisé et sécurisé
            document.getElementById('video-frame').src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&controls=1&rel=0";
            document.getElementById('player-overlay').style.display = 'block';
        }

        function closeVideo() {
            isPlaying = false;
            document.getElementById('player-overlay').style.display = 'none';
            document.getElementById('video-frame').src = ""; 
        }

        document.addEventListener('keydown', function(e) {
            if (isPlaying) {
                if (e.keyCode === 10009 || e.key === "Backspace" || e.keyCode === 27) { 
                    closeVideo();
                    e.preventDefault();
                }
                return;
            }

            document.getElementById("video-" + currentIndex).classList.remove('focused');

            if (e.keyCode === 37) {
                if (currentIndex > 0) currentIndex--;
            } else if (e.keyCode === 39) {
                if (currentIndex < totalVideos - 1) currentIndex++;
            } else if (e.keyCode === 13) {
                document.getElementById("video-" + currentIndex).click();
            }

            document.getElementById("video-" + currentIndex).classList.add('focused');
        });
    </script>
</body>
</html>
