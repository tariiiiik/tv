<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidéos Approuvées</title>
    <style>
        body {
            margin: 0;
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #e50914;
        }

        .grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 90%;
        }

        .video-card {
            background: #222;
            border: 4px solid transparent;
            border-radius: 15px;
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 15px;
        }

        /* Sélection à la télécommande, clavier ou survol de souris */
        .video-card.focused, .video-card:hover {
            border-color: #ffffff;
            transform: scale(1.05);
            background: #333;
        }

        /* Miniatures automatiques YouTube */
        .video-thumb {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #000;
        }

        .video-card p {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            z-index: 9999;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Vidéos Autorisées</h1>
    
    <div class="grid" id="videoGrid"></div>

    <div id="player-overlay">
        <div id="yt-player"></div>
    </div>

    <!-- Script de l'API YouTube obligatoire -->
    <script src="https://youtube.com"></script>
    <script>
        // CONFIGURATION DES VIDÉOS ICI
        // Mettez les titres que vous voulez et les vrais ID de vos vidéos YouTube
        const APPROVED_VIDEOS = [
            { id: "2HNgd0n2h5Y", title: "Colors in English" },
            { id: "gifwrHhhOCE", title: "Car Colors" },
            { id: "-6H89G8Tn0E", title: "Lion and mouse" }
        ];

        let currentIndex = 0;
        let player = null;
        let isPlaying = false;

        // Génération visuelle de la grille
        const grid = document.getElementById('videoGrid');
        APPROVED_VIDEOS.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = `video-card ${index === 0 ? 'focused' : ''}`;
            card.id = `video-${index}`;
            
            // Génère l'image de la miniature en haute qualité directement depuis YouTube
            card.innerHTML = `
                <img class="video-thumb" src="https://youtube.com{video.id}/hqdefault.jpg" alt="thumbnail">
                <p>${video.title}</p>
            `;
            
            // Gestion du Clic Souris / Tactile (Pour PC et Portable)
            card.addEventListener('click', function() {
                playVideo(video.id);
            });
            
            grid.appendChild(card);
        });

        // Gestion du Clavier (PC) et de la Télécommande (TV Samsung)
        document.addEventListener('keydown', function(e) {
            if (isPlaying) {
                // Touche Retour TV (10009) ou Retour Arrière / Échap sur PC
                if (e.keyCode === 10009 || e.key === "Backspace" || e.keyCode === 27) { 
                    closeVideo();
                    e.preventDefault();
                }
                return;
            }

            const total = APPROVED_VIDEOS.length;
            document.getElementById(`video-${currentIndex}`).classList.remove('focused');

            switch(e.keyCode) {
                case 37: // Flèche Gauche
                    if (currentIndex > 0) currentIndex--;
                    break;
                case 39: // Flèche Droite
                    if (currentIndex < total - 1) currentIndex++;
                    break;
                case 13: // Touche OK / Entrée
                    playVideo(APPROVED_VIDEOS[currentIndex].id);
                    break;
            }

            document.getElementById(`video-${currentIndex}`).classList.add('focused');
        });

        // Fonction pour lancer la vidéo sélectionnée
        function playVideo(videoId) {
            isPlaying = true;
            document.getElementById('player-overlay').style.display = 'block';

            if (player) { player.destroy(); }

            // Création du lecteur vidéo sécurisé (bloqué sur cette vidéo)
            player = new YT.Player('yt-player', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,            // Pas de suggestions d'autres chaînes à la fin
                    'modestbranding': 1, // Masque le logo cliquable YouTube
                    'mute': 1            // Mute requis pour forcer le lancement automatique sur PC/Mobile
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
            // Réactive le son automatiquement une demi-seconde après le lancement
            setTimeout(() => { event.target.unMute(); }, 500);
        }

        function onPlayerStateChange(event) {
            // Ferme automatiquement le mode plein écran quand la vidéo est finie
            if (event.data === YT.PlayerState.ENDED) {
                closeVideo();
            }
        }

        function closeVideo() {
            isPlaying = false;
            document.getElementById('player-overlay').style.display = 'none';
            if (player) { player.stopVideo(); }
        }
    </script>
</body>
</html>
