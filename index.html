<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitelisted YouTube Player</title>
    <style>
        /* Base styles optimized for a 1080p/4K TV Screen */
        body {
            margin: 0;
            background-color: #141414;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #e50914; /* Netflix-style red accent */
        }

        /* Grid layout for videos */
        .video-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 90%;
        }

        /* Video thumbnail cards */
        .video-card {
            background: #222;
            border: 4px solid transparent;
            border-radius: 8px;
            padding: 10px;
            width: 280px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        /* Visual indicator for Tizen remote navigation focus */
        .video-card.focused {
            border-color: #ffffff;
            transform: scale(1.05);
            background: #333;
        }

        .video-card img {
            width: 100%;
            border-radius: 4px;
        }

        .video-card p {
            margin-top: 10px;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Fullscreen Player overlay */
        #player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            z-index: 9999;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1 id="app-title">Approved Videos Only</h1>
    
    <!-- Grid of allowed videos -->
    <div class="video-grid" id="videoGrid"></div>

    <!-- Fullscreen Player Wrapper -->
    <div id="player-overlay">
        <div id="yt-player"></div>
    </div>

    <!-- Load the YouTube Iframe API -->
    <script src="https://youtube.com"></script>
    <script>
        // 1. DEFINE YOUR WHITELIST HERE
        // Replace these with your exact allowed YouTube Video IDs and Titles
        const WHITELISTED_VIDEOS = [
            { id: "P1IRrkKeww", title: "Learn about jobs" },
            { id: "USW8_gV_Hnw", title: "Learn Colors" },
            { id: "nPG6F43E75s", title: "Learn arabic" }

        ];

        let currentIndex = 0;
        let player = null;
        let isPlaying = false;

        // 2. Build the UI grid dynamically
        const grid = document.getElementById('videoGrid');
        WHITELISTED_VIDEOS.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = `video-card ${index === 0 ? 'focused' : ''}`;
            card.id = `video-${index}`;
            card.innerHTML = `
                <img src="https://youtube.com{video.id}/hqdefault.jpg" alt="thumbnail">
                <p>${video.title}</p>
            `;
            grid.appendChild(card);
        });

        // 3. Handle Tizen TV Remote Control inputs
        document.addEventListener('keydown', function(e) {
            if (isPlaying) {
                // If a video is playing, pressing Return/Back closes it
                if (e.keyCode === 10009 || e.key === "Backspace" || e.keyCode === 27) { 
                    closeVideo();
                    e.preventDefault();
                }
                return;
            }

            const totalVideos = WHITELISTED_VIDEOS.length;
            document.getElementById(`video-${currentIndex}`).classList.remove('focused');

            switch(e.keyCode) {
                case 37: // Left Arrow
                    if (currentIndex > 0) currentIndex--;
                    break;
                case 39: // Right Arrow
                    if (currentIndex < totalVideos - 1) currentIndex++;
                    break;
                case 13: // Enter / Select Button
                    playVideo(WHITELISTED_VIDEOS[currentIndex].id);
                    break;
                case 10009: // Tizen Return/Back Key (prevents app from closing instantly)
                    console.log("Back pressed on main menu");
                    break;
            }

            document.getElementById(`video-${currentIndex}`).classList.add('focused');
        });

        // 4. YouTube API Player Functions
        function onYouTubeIframeAPIReady() {
            // API loaded successfully, ready for instantiation
        }

        function playVideo(videoId) {
            isPlaying = true;
            document.getElementById('player-overlay').style.display = 'block';

            // Safely destroy previous player instance if it exists
            if (player) {
                player.destroy();
            }

            // Create a brand new locked-down player instance
            player = new YT.Player('yt-player', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,     // Shows pause/play timelines
                    'rel': 0,          // Restricts related videos to the same channel (max protection possible)
                    'modestbranding': 1, // Hides the YouTube logo link
                    'disablekb': 1     // Disables external keyboard shortcuts
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // Automatically close the fullscreen overlay when the video ends
            if (event.data === YT.PlayerState.ENDED) {
                closeVideo();
            }
        }

        function closeVideo() {
            isPlaying = false;
            document.getElementById('player-overlay').style.display = 'none';
            if (player) {
                player.stopVideo();
            }
        }
    </script>
</body>
</html>
